[project]
name = "jupyter-storage-explorer-abfs-support"
dynamic = ["version", "dependencies"]
description = "Azure Data Lake Storage support for Storage Explorer"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tsuyoshi SUGIBUCHI" }]
keywords = ["jupyter", "jupyter-storage-explorer", "azure", "adls", "data lake", "adlfs"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Jupyter",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.11"

[project.urls]
Homepage = "https://github.com/sugibuchi/jupyter-storage-explorer/tree/main/plugins/abfs-support"
Source = "https://github.com/sugibuchi/jupyter-storage-explorer"
Issues = "https://github.com/sugibuchi/jupyter-storage-explorer/issues"

# Explorers load the plugin by this entry point, named by its key.
[project.entry-points."jupyter_storage_explorer.plugins"]
abfs-support = "jupyter_storage_explorer_abfs_support:AbfsSupport"

# The libraries the plugin uses: not dependencies, so that installing the
# plugin never changes those of a shared environment; "full" installs them.
[project.optional-dependencies]
full = [
    "adlfs>=2022.2.0",
    "azure-storage-file-datalake>=12.0.0",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The same version as jupyter-storage-explorer: from the repository's git tags.
[tool.hatch.version]
source = "vcs"
raw-options = { root = "../..", version_scheme = "post-release" }

# The dependencies, set by hatch_build.py: jupyter-storage-explorer at the
# plugin's own version.
[tool.hatch.metadata.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/jupyter_storage_explorer_abfs_support"]

[dependency-groups]
dev = [
    "adlfs>=2022.2.0",
    "azure-storage-file-datalake>=12.0.0",
    # The tests' (tests/), besides the libraries.
    "pytest>=9.1.1",
]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "hatch_build.py" }, { git = { commit = true, tags = true } }]

[tool.uv.sources]
jupyter-storage-explorer = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
