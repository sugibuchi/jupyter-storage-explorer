[project]
name = "jupyter-storage-explorer"
dynamic = ["version"]
description = "Explore your data lake without leaving Jupyter: built for data professionals"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tsuyoshi SUGIBUCHI" }]
keywords = [
    "jupyter",
    "jupyterlab",
    "anywidget",
    "fsspec",
    "s3",
    "azure",
    "gcs",
    "data lake",
    "delta lake",
    "parquet",
    "file browser",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Filesystems",
]
requires-python = ">=3.11"
dependencies = [
    "anywidget>=0.9",
    "fsspec>=2023.1.0",
    "jupyter-core>=5",
    "narwhals>=2.20",
    "pygments>=2.12",
    "traitlets>=5.4",
]

# The plugins of this repository (plugins/<name>-support), released with the
# explorer at its version: "<name>" installs one with its libraries (its "full"
# extra), "<name>-support" alone, using the libraries already installed; "all"
# and "all-supports" every plugin so. No version here: each plugin requires
# the explorer of exactly its own version, so only the plugins of this one's
# can be installed with it. The launcher offers the same extras.
[project.optional-dependencies]
abfs = ["jupyter-storage-explorer-abfs-support[full]"]
abfs-support = ["jupyter-storage-explorer-abfs-support"]
# Experimental, as fsspec-databricks is: not in "all" or "all-supports".
databricks = ["jupyter-storage-explorer-databricks-support[full]"]
databricks-support = ["jupyter-storage-explorer-databricks-support"]
# Experimental, as it is not tested on a Dask cluster: not in "all" or
# "all-supports".
dask = ["jupyter-storage-explorer-dask-support[full]"]
dask-support = ["jupyter-storage-explorer-dask-support"]
duckdb = ["jupyter-storage-explorer-duckdb-support[full]"]
duckdb-support = ["jupyter-storage-explorer-duckdb-support"]
pandas = ["jupyter-storage-explorer-pandas-support[full]"]
pandas-support = ["jupyter-storage-explorer-pandas-support"]
polars = ["jupyter-storage-explorer-polars-support[full]"]
polars-support = ["jupyter-storage-explorer-polars-support"]
pyspark = ["jupyter-storage-explorer-pyspark-support[full]"]
pyspark-support = ["jupyter-storage-explorer-pyspark-support"]
# Every plugin: with their libraries, or alone.
all = ["jupyter-storage-explorer[abfs,duckdb,pandas,polars,pyspark]"]
all-supports = ["jupyter-storage-explorer[abfs-support,duckdb-support,pandas-support,polars-support,pyspark-support]"]

[project.urls]
Homepage = "https://github.com/sugibuchi/jupyter-storage-explorer"
Source = "https://github.com/sugibuchi/jupyter-storage-explorer"
Issues = "https://github.com/sugibuchi/jupyter-storage-explorer/issues"
Changelog = "https://github.com/sugibuchi/jupyter-storage-explorer/releases"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { 'version_scheme' = 'post-release' }

[tool.hatch.build.targets.wheel]
packages = ["src/jupyter_storage_explorer"]

[tool.hatch.build.targets.sdist]
exclude = ["launcher", "plugins", ".github"]

[dependency-groups]
dev = [
    "adlfs>=2022.2.0",
    "azure-storage-file-datalake>=12.0.0",
    "dask[dataframe]>=2026.8.0",
    "deltalake>=1.6.6",
    # Below 2 until sqlframe (Spark's stand-in in tests) stops calling
    # fetch_arrow_table(), which DuckDB 2.0 removed (sqlframe 4.5.0 still does).
    "duckdb>=1.5.6,<2",
    "fastexcel>=0.21.0",
    "jupyter-storage-explorer-abfs-support",
    "jupyter-storage-explorer-dask-support",
    "jupyter-storage-explorer-databricks-support",
    "jupyter-storage-explorer-duckdb-support",
    "jupyter-storage-explorer-launcher",
    "jupyter-storage-explorer-pandas-support",
    "jupyter-storage-explorer-polars-support",
    "jupyter-storage-explorer-pyspark-support",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "nodejs-wheel>=24.19.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "sqlframe>=4.4.0",
]
docs = [
    "pillow>=12.3.0",
    "playwright>=1.64.0",
]

# Packages released together: jupyter-storage-explorer (this folder: the
# widgets), jupyter-storage-explorer-launcher (launcher/: the JupyterLab
# launcher item) and the plugins (plugins/<name>-support). All are installed
# for development.
[tool.uv.workspace]
members = ["launcher", "plugins/*"]

[tool.uv.sources]
jupyter-storage-explorer-launcher = { workspace = true }
jupyter-storage-explorer-abfs-support = { workspace = true }
jupyter-storage-explorer-dask-support = { workspace = true }
jupyter-storage-explorer-databricks-support = { workspace = true }
jupyter-storage-explorer-duckdb-support = { workspace = true }
jupyter-storage-explorer-pandas-support = { workspace = true }
jupyter-storage-explorer-polars-support = { workspace = true }
jupyter-storage-explorer-pyspark-support = { workspace = true }

[tool.uv]
# Rebuild the project when its git commit or tags change, as its version
# comes from git (hatch-vcs), not only when pyproject.toml changes.
cache-keys = [
    { file = "pyproject.toml" },
    { git = { commit = true, tags = true } },
]

[tool.pytest.ini_options]
# The explorer's and the launcher's tests, and each plugin's (in its folder).
testpaths = ["tests", "plugins"]
# The launcher's Python code, for tests/launcher/test_launcher.py: CI does not install
# the launcher (its JupyterLab extension is not built there).
pythonpath = ["launcher/src"]
filterwarnings = [
    # Inside sqlframe (the stand-in for Spark in tests), from its DuckDB calls.
    "ignore:fetch_arrow_table\\(\\) is deprecated:DeprecationWarning:sqlframe",
]

# Coverage of the widgets' package and the plugins (the launcher's tests run
# its code from launcher/src), for Codecov.
[tool.coverage.run]
source = ["src/jupyter_storage_explorer", "plugins"]
omit = ["plugins/*/hatch_build.py", "plugins/*/tests/*"]

[tool.ruff]
exclude = [
    ".tox",
    "build",
    "src/jupyter_storage_explorer/_version",
]
line-length = 88

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "C",
    "G",
    "E",
    "F",
    "FURB",
    "I",
    "LOG",
    "PERF",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "PIE",
    "PYI",
    "RUF",
    "SIM",
    "SLOT",
    "TC",
    "UP",
]
ignore = [
    "E501",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "SIM117",
]

[tool.ruff.lint.per-file-ignores]
# Actions import their libraries inside the functions, so that plugins load
# without them.
"plugins/*/src/**" = ["PLC0415"]
# The users' actions file: its imports serve the commented example.
"src/jupyter_storage_explorer/_extensions/actions_template.py" = ["F401"]

[tool.ruff.lint.flake8-type-checking]
# Actions' decorators read the options class from the annotation at run time.
runtime-evaluated-decorators = [
    "jupyter_storage_explorer.formats.actions.code",
    "jupyter_storage_explorer.formats.actions.view",
]

[tool.ruff.lint.flake8-bugbear]
# Options' field specifiers, dataclasses.field with metadata (RUF009, B008).
extend-immutable-calls = [
    "jupyter_storage_explorer.util.secret_dict_field",
    "jupyter_storage_explorer.util.secret_field",
]
