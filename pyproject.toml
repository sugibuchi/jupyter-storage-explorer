[project]
name = "jupyter-storage-explorer"
dynamic = ["version"]
description = "A storage explorer for Jupyter: browse cloud storage and data lakes, preview Parquet, Delta Lake and more"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anywidget>=0.9",
    "fsspec>=2023.1.0",
    "pygments>=2.12",
    "traitlets>=5.4",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
raw-options = { 'version_scheme' = 'post-release' }

[tool.hatch.build.targets.wheel]
packages = ["src/jupyter_storage_explorer"]

[tool.hatch.build.targets.sdist]
exclude = ["launcher", ".github"]

[dependency-groups]
dev = [
    "deltalake>=1.6.6",
    "fastexcel>=0.21.0",
    "jupyter-storage-explorer-launcher",
    "jupyterlab>=4.6.4",
    "nodejs-wheel>=24.19.0",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "pytest>=9.1.1",
]

# Two packages, released together: jupyter-storage-explorer (this folder: the
# widgets) and jupyter-storage-explorer-launcher (launcher/: the JupyterLab
# launcher item). Both are installed for development.
[tool.uv.workspace]
members = ["launcher"]

[tool.uv.sources]
jupyter-storage-explorer-launcher = { workspace = true }

[tool.uv]
# Rebuild the project when its git commit or tags change, as its version
# comes from git (hatch-vcs), not only when pyproject.toml changes.
cache-keys = [{ file = "pyproject.toml" }, { git = { commit = true, tags = true } }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
exclude = [
    ".tox",
    "build",
    "src/jupyter_storage_explorer/_version",
]
line-length = 88

[tool.ruff.lint]
select = [
    "ASYNC",
    "B",
    "C",
    "G",
    "E",
    "F",
    "FURB",
    "I",
    "LOG",
    "PERF",
    "PLC",
    "PLE",
    "PLR",
    "PLW",
    "PIE",
    "PYI",
    "RUF",
    "SIM",
    "SLOT",
    "TC",
    "UP",
]
ignore = [
    "E501",
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "SIM117",
]
