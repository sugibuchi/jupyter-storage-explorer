# Dependabot keeps the workflows' actions, pinned to commit SHAs, and the
# launcher extension's npm packages (launcher/labextension/yarn.lock) up to
# date: a pull request a month for each, its updates grouped. The Python
# dependencies are ranges in the pyproject.toml files, and uv.lock is not
# committed, so it has nothing to update there.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /launcher/labextension
    schedule:
      interval: monthly
    groups:
      labextension:
        patterns: ["*"]
