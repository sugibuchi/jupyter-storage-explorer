# Lint and test on every push and pull request, and upload the test coverage
# to Codecov (the README's badge). Uploading needs the repository secret
# CODECOV_TOKEN, from the repository's settings on codecov.io.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0  # no major-version tags (e.g. v10) since v8

      - name: Ruff check
        run: uvx ruff check src launcher/src plugins tests docs/scripts

      - name: Ruff format check
        run: uvx ruff format --check src launcher/src plugins tests docs/scripts

      # The widgets' frontend (src/jupyter_storage_explorer/static/, see .prettierrc.json).
      - name: Prettier check
        run: npx --yes prettier@3.3.3 --check .

  # The launcher's JupyterLab extension, type-checked and compiled (tsc), installed
  # as the release workflow does (Node.js from nodejs-wheel); yarn.lock must be up to date.
  extension:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.0  # no major-version tags (e.g. v10) since v8

      - name: Compile the JupyterLab extension
        working-directory: launcher/labextension
        run: |
          uv run --no-project --with "jupyterlab>=4.6.4,<5" --with nodejs-wheel jlpm install --immutable
          uv run --no-project --with "jupyterlab>=4.6.4,<5" --with nodejs-wheel jlpm build:lib

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version comes from the git tags (hatch-vcs)

      - uses: astral-sh/setup-uv@v10.3.0  # no major-version tags (e.g. v10) since v8
        with:
          python-version: "3.14"

      # The launcher is left out: its JupyterLab extension is not built here.
      # Its tests import its Python code from launcher/src (pytest's pythonpath).
      # The plugins (plugins/) are installed, with their entry points.
      - name: Install the project
        run: uv sync --no-install-package jupyter-storage-explorer-launcher

      # Each widget's module as the kernel joins it: its syntax, and names
      # undefined or unused (ESLint).
      - name: JavaScript check
        run: uv run --no-sync tests/browser/check_js.py

      - name: Test with coverage
        run: uv run --no-sync pytest --cov --cov-report=term --cov-report=xml:coverage.xml

      - name: Upload coverage to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml

  # pyspark-support's tests on a real local Spark session: pyspark is left out
  # of the shared environment (the explorer's tests expect it missing), and
  # Spark needs Java. Run alone, with the plugin's dev group.
  spark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # the version comes from the git tags (hatch-vcs)

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: astral-sh/setup-uv@v10.3.0  # no major-version tags (e.g. v10) since v8
        with:
          python-version: "3.12"

      - name: Test pyspark-support on Spark
        working-directory: plugins/pyspark-support
        run: uv run --isolated --package jupyter-storage-explorer-pyspark-support pytest
