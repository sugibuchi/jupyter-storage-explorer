# Release, part 2: once release-explorer.yaml has succeeded for a version tag
# (so jupyter-storage-explorer, which the launcher depends on, is on PyPI),
# build jupyter-storage-explorer-launcher for the same tag, add it to the
# GitHub release, and publish it to PyPI. It can also be run by hand for a tag
# (Actions ▸ Release launcher ▸ Run workflow), e.g. to retry.
#
# PyPI publishing uses trusted publishing (no token): the PyPI project
# jupyter-storage-explorer-launcher needs a trusted publisher for this
# repository, workflow `release-launcher.yaml` and environment `pypi` (see
# DEVELOPMENT.md).
name: Release launcher

on:
  # The jobs check that the run came from a tag pushed here (see their if).
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["Release explorer"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to release, e.g. v0.0.6"
        required: true

permissions:
  contents: read

env:
  # The tag the explorer was released for (a tag push's "branch"), or the one given.
  TAG: ${{ inputs.tag || github.event.workflow_run.head_branch }}

jobs:
  build:
    # Only after a successful explorer release, run for a tag pushed to this
    # repository: a workflow of the same name in a fork's pull request also
    # ends with workflow_run, and must not release.
    if: >-
      github.event_name == 'workflow_dispatch' || (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_repository.full_name == github.repository &&
        github.event.workflow_run.path == '.github/workflows/release-explorer.yaml'
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false  # no job pushes: the token is not left in .git/config
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0  # the version comes from the git tags (hatch-vcs)

      - name: Check the tag
        run: |
          case "$TAG" in v*) ;; *) echo "not a version tag: $TAG"; exit 1 ;; esac
          test "$(git describe --tags --exact-match)" = "$TAG"

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

        with:

          version: "0.12.22"  # not the latest uv: the same in every run

      # Node.js comes with nodejs-wheel, as in development (see DEVELOPMENT.md).
      # Exact versions, as CI's (ci.yaml): raise them with the dev group's.
      # --immutable: the packages of yarn.lock, never others.
      - name: Build the JupyterLab extension
        working-directory: launcher/labextension
        run: |
          uv run --no-project --with jupyterlab==4.6.4 --with nodejs-wheel==24.19.0 jlpm install --immutable
          uv run --no-project --with jupyterlab==4.6.4 --with nodejs-wheel==24.19.0 jlpm build:prod

      - name: Build the package
        run: uv build --package jupyter-storage-explorer-launcher --out-dir dist

      - name: Check the package
        run: |
          uv run --no-project python - <<'EOF'
          import glob, os, sys, zipfile

          version = os.environ["TAG"].removeprefix("v")
          files = sorted(os.path.basename(f) for f in glob.glob("dist/*"))
          print("\n".join(files))
          expected = [
              f"jupyter_storage_explorer_launcher-{version}-py3-none-any.whl",
              f"jupyter_storage_explorer_launcher-{version}.tar.gz",
          ]
          if files != expected:
              sys.exit(f"expected {expected} for tag {version}")
          wheel = zipfile.ZipFile(f"dist/{expected[0]}")
          if not any("labextensions/jupyter-storage-explorer-launcher/static/" in n for n in wheel.namelist()):
              sys.exit("the wheel has no JupyterLab extension")
          # The explorer of the same version (launcher/hatch_build.py).
          metadata = wheel.read(f"jupyter_storage_explorer_launcher-{version}.dist-info/METADATA").decode()
          if f"Requires-Dist: jupyter-storage-explorer=={version}" not in metadata.splitlines():
              sys.exit(f"the wheel does not require jupyter-storage-explorer=={version}")
          EOF

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      # The release was created by release-explorer.yaml.
      - name: Add the files to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/jupyter-storage-explorer-launcher/
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3
