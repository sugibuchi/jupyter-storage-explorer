[project]
name = "jupyter-storage-explorer-launcher"
dynamic = ["version", "dependencies"]
description = "Adds Jupyter Storage Explorer to the JupyterLab launcher, opening it in a tab"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tsuyoshi SUGIBUCHI" }]
keywords = [
    "jupyter",
    "jupyterlab",
    "jupyterlab-extension",
    "launcher",
    "fsspec",
    "s3",
    "azure",
    "gcs",
    "data lake",
    "file browser",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Jupyter",
    "Framework :: Jupyter :: JupyterLab",
    "Framework :: Jupyter :: JupyterLab :: 4",
    "Framework :: Jupyter :: JupyterLab :: Extensions",
    "Framework :: Jupyter :: JupyterLab :: Extensions :: Prebuilt",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Filesystems",
]
requires-python = ">=3.11"

# The explorer's extras, its plugins (see its pyproject.toml): e.g. "polars"
# installs the explorer's "polars" extra, at the explorer's version that the
# launcher requires (hatch_build.py).
[project.optional-dependencies]
abfs = ["jupyter-storage-explorer[abfs]"]
abfs-support = ["jupyter-storage-explorer[abfs-support]"]
# Experimental: not in "all" or "all-supports".
databricks = ["jupyter-storage-explorer[databricks]"]
databricks-support = ["jupyter-storage-explorer[databricks-support]"]
pandas = ["jupyter-storage-explorer[pandas]"]
pandas-support = ["jupyter-storage-explorer[pandas-support]"]
polars = ["jupyter-storage-explorer[polars]"]
polars-support = ["jupyter-storage-explorer[polars-support]"]
pyspark = ["jupyter-storage-explorer[pyspark]"]
pyspark-support = ["jupyter-storage-explorer[pyspark-support]"]
all = ["jupyter-storage-explorer[all]"]
all-supports = ["jupyter-storage-explorer[all-supports]"]

[project.urls]
Homepage = "https://github.com/sugibuchi/jupyter-storage-explorer/tree/main/launcher"
Source = "https://github.com/sugibuchi/jupyter-storage-explorer"
Issues = "https://github.com/sugibuchi/jupyter-storage-explorer/issues"
Changelog = "https://github.com/sugibuchi/jupyter-storage-explorer/releases"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

# The same version as jupyter-storage-explorer: from the repository's git tags.
[tool.hatch.version]
source = "vcs"
raw-options = { root = "..", version_scheme = "post-release" }

# The dependencies, set by hatch_build.py: jupyter-core, and
# jupyter-storage-explorer at the launcher's own version.
[tool.hatch.metadata.hooks.custom]

[tool.hatch.build.targets.wheel]
packages = ["src/jupyter_storage_explorer_launcher"]

# The JupyterLab extension, installed where JupyterLab finds prebuilt
# extensions. Packaging does not build it: build it first with
# `uv run jlpm build:prod` in labextension/ (see DEVELOPMENT.md).
[tool.hatch.build.targets.wheel.shared-data]
"src/jupyter_storage_explorer_launcher/labextension" = "share/jupyter/labextensions/jupyter-storage-explorer-launcher"
"install.json" = "share/jupyter/labextensions/jupyter-storage-explorer-launcher/install.json"

[tool.hatch.build.targets.sdist]
exclude = ["labextension/node_modules", "labextension/lib", "labextension/.yarn"]
# The built extension (git-ignored) too, so building a wheel from the sdist
# needs no Node.js.
artifacts = ["src/jupyter_storage_explorer_launcher/labextension"]

[tool.uv]
# Rebuilding the extension (which changes its package.json) reinstalls the
# package; the version comes from git, hence the git keys.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "hatch_build.py" },
    { file = "src/jupyter_storage_explorer_launcher/labextension/package.json" },
    { git = { commit = true, tags = true } },
]

[tool.uv.sources]
jupyter-storage-explorer = { workspace = true }
